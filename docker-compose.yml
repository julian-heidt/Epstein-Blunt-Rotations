# Docker Swarm stack file.
#
# Images are built and pushed by GitHub Actions (.github/workflows/build.yml)
# on every push to main that touches backend/, frontend/ or the workflow:
#   ghcr.io/julian-heidt/evilblunts-backend:latest   (also sha-<short commit>)
#   ghcr.io/julian-heidt/evilblunts-frontend:latest  (also sha-<short commit>)
#
# Deploy by hand (the manager needs a GHCR login first, or
# --with-registry-auth sends no credentials; docker login prompts for a
# read:packages PAT, never in argv):
#   docker login ghcr.io -u julian-heidt
#   export MONGO_ROOT_USERNAME=... MONGO_ROOT_PASSWORD=... ALLOWED_ORIGINS=...
#   docker stack deploy --with-registry-auth -c docker-compose.yml ebr

volumes:
  mongo_data:
    driver: local
    # NFS is not supported for MongoDB data files — WiredTiger requires POSIX
    # advisory file locking that NFS does not reliably provide, causing write
    # failures while reads appear to work (served from WiredTiger cache).
    # Using a plain local Docker volume. It exists only on the node where mongo
    # has run. Mongo is pinned to the one node labelled ebr_mongo=true, which
    # holds this volume (node.labels.ebr_mongo == true below). The avx == true
    # constraint stays as well, so a missing label leaves the task pending
    # instead of starting mongo on an empty volume.

networks:
  ebr-net:
    driver: overlay
  proxy-net:
    external: true
  monitoring:
    external: true

services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: evil_blunts
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    networks:
      - ebr-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      placement:
        constraints:
          - node.labels.avx == true
          - node.labels.ebr_mongo == true
      # stop-first: two mongod tasks must never share the local data volume.
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 90s
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 90s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 1G
          cpus: "1.00"
        reservations:
          memory: 512M

  backend:
    image: ghcr.io/julian-heidt/evilblunts-backend:latest
    environment:
      MONGO_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: "mongo:27017"
      MONGO_DB: "evil_blunts"
      FORCE_RESEED: "false"
      PYTHONUNBUFFERED: "1"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://evilblunts.org,http://localhost:3500}
    networks:
      ebr-net:
      monitoring:
        aliases:
          - ebr-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      placement:
        constraints:
          - node.labels.media != true
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 120s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 120s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 256M

  frontend:
    image: ghcr.io/julian-heidt/evilblunts-frontend:latest
    networks:
      - ebr-net
      - proxy-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      placement:
        constraints:
          - node.labels.media != true
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 120s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 120s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
