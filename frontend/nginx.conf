server {
    listen 3500;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Client address for the rate limiter. Nginx Proxy Manager sets X-Real-IP
    # to the address it saw and replaces any X-Real-IP the visitor sent. Take
    # that header only when the TCP peer is inside the Docker overlay range, so
    # a request that reaches this container any other way cannot choose its own
    # address. If proxy-net uses a subnet outside this range, widen it here,
    # and widen TRUSTED_PROXY_CIDRS on the backend to match.
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Real-IP;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.wikimedia.org; connect-src 'self';" always;

    # Serve static assets with cache. A location that sets its own add_header
    # drops every header inherited from the server block, so the security
    # headers are repeated here. Keep them in step with the ones above.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.wikimedia.org; connect-src 'self';" always;
    }

    # Proxy API calls to backend
    # Use a variable so nginx resolves DNS at request time (not just startup).
    # This prevents "host not found" crashes when the backend starts after nginx.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        # $remote_addr is the address derived above. Overwrite both headers
        # instead of appending, so nothing the visitor sent reaches the backend.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
